<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#350d3e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Guard Tour · ทางเข้า Dashboard</title>
  <link rel="icon" href="assets/pea_logo.png" type="image/png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="access-shell" aria-labelledby="access-title">
    <section class="access-identity">
      <img src="assets/pea_logo.png" width="56" height="56" alt="การไฟฟ้าส่วนภูมิภาค">
      <h1 id="access-title">แดชบอร์ด<br>การเดินตรวจ</h1>
      <p>ติดตามผลรอบตรวจและประวัติการปฏิบัติงานของสถานีไฟฟ้า</p>
    </section>
    <section class="access-form">
      <h2>เข้าใช้งานสำหรับผู้ดูแล</h2>
      <p>ใช้บัญชี Google ที่ได้รับสิทธิ์ Admin และรหัสผ่าน Dashboard ในหน้าที่เปิดถัดไป</p>
      <a class="button primary access-action" href="https://script.google.com/macros/s/AKfycbzJkQghDeRhNsRiI0NNUI3mKvZsqB0UJVz8bm4zs7cFVw9WK_8CpPa2qyZaKJKETABgsw/exec">เปิด Dashboard <span aria-hidden="true">↗</span></a>
      <p class="access-help">หากเปิดลิงก์จากแอปแชต ให้เปิดในเบราว์เซอร์หลักที่ลงชื่อด้วยบัญชีผู้ดูแล</p>
    </section>
  </main>
</body>
</html>
